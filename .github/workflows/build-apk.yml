
name: Generar APK Taller Ulloa

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraer proyecto Android
        run: |
          mkdir proyecto
          unzip -o Taller_Ulloa_Facturacion_Android_Proyecto_DESCARGA.zip -d proyecto

      - name: Compilar APK
        run: gradle -p proyecto/TallerUlloaAndroid --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Taller-Ulloa-Facturacion
          path: proyecto/TallerUlloaAndroid/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

        
